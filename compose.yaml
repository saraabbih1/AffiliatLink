
services:
  postgres:
    image: postgres:17
    container_name: affiliatlink-db
    environment:
      POSTGRES_DB: affiliatlink
      POSTGRES_USER: affiliatlink_user
      POSTGRES_PASSWORD: dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
