server:
  port: 8081

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/affiliatlink
    username: affiliatlink_user
    password: dev_password
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: true

  flyway:
    enabled: true

logging:
  level:
    root: INFO
    ma.youcode.affiliatlink: DEBUG
    org.springframework: WARN

  file:
    name: logs/affiliatlink.log
